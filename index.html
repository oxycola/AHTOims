<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ukiah Natural Foods Co-op — Special Orders</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0b0f1a; color: #e2e8f0; font-family: 'DM Sans', sans-serif; min-height: 100vh; }
    input, textarea, button { font-family: 'DM Sans', sans-serif; }
    input:focus, textarea:focus { outline: none; border-color: #3b82f6 !important; }
  </style>
</head>
<body>
<div id="root"></div>
<script>
(function() {
  const API = 'https://ahtoims.up.railway.app/api';
  const params = new URLSearchParams(window.location.search);
  const soUpc = params.get('specialorder');

  // ── If QR code scan — show order form ──────────────────────────────────────
  if (soUpc) {
    const name = decodeURIComponent(params.get('name') || 'Unknown Item');
    const unitsPerCase = parseInt(params.get('upc_qty') || '1');
    const costPerUnit = parseFloat(params.get('cost') || '0');

    let phone = '', isMember = null, memberNumber = '', cases = '', notes = '';
    let submitted = false, submitting = false, error = '';

    function render() {
      const root = document.getElementById('root');
      if (submitted) {
        root.innerHTML = `
          <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;">
            <div style="background:#111827;border:1px solid #1e4a7a;border-radius:16px;padding:40px;max-width:420px;width:100%;text-align:center;">
              <div style="font-size:48px;margin-bottom:16px;">✅</div>
              <div style="font-size:22px;font-weight:700;color:#f1f5f9;margin-bottom:12px;">Order Submitted!</div>
              <div style="font-size:14px;color:#94a3b8;line-height:1.7;">Your special order for <strong style="color:#60a5fa">${name}</strong> has been received. A staff member will contact you at <strong style="color:#60a5fa">${phone}</strong> to confirm availability and pricing.</div>
              <div style="margin-top:20px;font-size:12px;color:#475569;">You may close this window.</div>
            </div>
          </div>`;
        return;
      }

      const casesNum = parseInt(cases) || 0;
      const est = casesNum * unitsPerCase * costPerUnit;

      root.innerHTML = `
        <div style="min-height:100vh;padding:28px 16px;">
          <div style="max-width:480px;margin:0 auto;">
            <div style="text-align:center;margin-bottom:28px;">
              <div style="font-size:13px;font-family:'DM Mono',monospace;color:#475569;letter-spacing:0.08em;text-transform:uppercase;margin-bottom:8px;">Ukiah Natural Foods Co-op</div>
              <div style="font-size:24px;font-weight:700;color:#f1f5f9;">Special Order Request</div>
              <div style="font-size:14px;color:#64748b;margin-top:4px;">Fill out this form and a staff member will follow up with you.</div>
            </div>

            <div style="background:#0d2137;border:1px solid #1e4a7a;border-radius:10px;padding:16px;margin-bottom:24px;">
              <div style="font-size:11px;color:#60a5fa;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:4px;">Item</div>
              <div style="font-size:18px;font-weight:700;color:#f1f5f9;">${name}</div>
              <div style="font-size:12px;color:#475569;margin-top:2px;">UPC: ${soUpc} · ${unitsPerCase} items per case</div>
            </div>

            <div style="display:flex;flex-direction:column;gap:20px;">
              <div>
                <label style="font-size:12px;color:#64748b;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;display:block;margin-bottom:6px;">Your Phone Number *</label>
                <input id="f-phone" type="tel" value="${phone}" placeholder="(555) 555-5555"
                  style="width:100%;background:#111827;border:1px solid #2d3f5e;border-radius:8px;padding:12px 14px;color:#e2e8f0;font-size:16px;" />
              </div>

              <div>
                <label style="font-size:12px;color:#64748b;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;display:block;margin-bottom:6px;">Are you a store member? *</label>
                <div style="display:flex;gap:10px;">
                  <button id="btn-member-yes" style="flex:1;padding:12px 0;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;border:1px solid ${isMember === true ? '#2d5a9e' : '#2d3f5e'};background:${isMember === true ? '#1e3a5f' : '#111827'};color:${isMember === true ? '#60a5fa' : '#64748b'};">Yes, I'm a Member</button>
                  <button id="btn-member-no" style="flex:1;padding:12px 0;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;border:1px solid ${isMember === false ? '#2d5a9e' : '#2d3f5e'};background:${isMember === false ? '#1e3a5f' : '#111827'};color:${isMember === false ? '#60a5fa' : '#64748b'};">No</button>
                </div>
              </div>

              ${isMember ? `
              <div>
                <label style="font-size:12px;color:#64748b;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;display:block;margin-bottom:6px;">Member Number *</label>
                <input id="f-member" value="${memberNumber}" placeholder="e.g. 10042"
                  style="width:100%;background:#111827;border:1px solid #2d3f5e;border-radius:8px;padding:12px 14px;color:#e2e8f0;font-size:16px;" />
                <div style="font-size:12px;color:#64748b;margin-top:8px;line-height:1.6;background:#111827;border-radius:7px;padding:8px 12px;border:1px solid #1e2d47;">
                  📇 <strong style="color:#94a3b8">Where to find your member number:</strong> It is printed on the front of your member card issued when you signed up at the store.
                </div>
              </div>` : ''}

              <div>
                <label style="font-size:12px;color:#64748b;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;display:block;margin-bottom:6px;">How Many Cases Would You Like? *</label>
                <input id="f-cases" type="number" value="${cases}" placeholder="e.g. 2" min="1"
                  style="width:100%;background:#111827;border:1px solid #2d3f5e;border-radius:8px;padding:12px 14px;color:#e2e8f0;font-size:16px;" />
                <div style="font-size:12px;color:#64748b;margin-top:6px;">Each case of <strong style="color:#94a3b8">${name}</strong> contains <strong style="color:#94a3b8">${unitsPerCase} individual items</strong>.</div>
              </div>

              ${casesNum > 0 ? `
              <div style="background:#111f10;border:1px solid #2a4020;border-radius:8px;padding:14px;">
                <div style="font-size:13px;font-weight:700;color:#86efac;margin-bottom:6px;">💡 Rough Price Estimate</div>
                <div style="font-size:14px;color:#94a3b8;line-height:1.6;">
                  ${casesNum} case${casesNum > 1 ? 's' : ''} may cost approximately <strong style="color:#86efac">$${(est * 1.25).toFixed(2)} – $${(est * 1.45).toFixed(2)}</strong>.
                </div>
                <div style="font-size:12px;color:#4b6b3a;margin-top:8px;line-height:1.6;">⚠️ <strong>This is a rough estimate only.</strong> Final price will be determined at time of pickup.</div>
              </div>` : ''}

              <div>
                <label style="font-size:12px;color:#64748b;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;display:block;margin-bottom:6px;">Additional Notes (optional)</label>
                <textarea id="f-notes" rows="3" placeholder="Anything else we should know..."
                  style="width:100%;background:#111827;border:1px solid #2d3f5e;border-radius:8px;padding:12px 14px;color:#e2e8f0;font-size:14px;resize:vertical;">${notes}</textarea>
              </div>

              ${error ? `<div style="background:#3b1f1f;border:1px solid #7f1d1d;border-radius:8px;padding:10px 14px;color:#f87171;font-size:13px;">${error}</div>` : ''}

              <button id="btn-submit" style="background:${submitting ? '#1d4ed8' : '#2563eb'};color:#fff;border:none;border-radius:8px;padding:15px 0;font-size:16px;font-weight:700;cursor:pointer;width:100%;opacity:${submitting ? '0.7' : '1'};">
                ${submitting ? 'Submitting...' : 'Submit Special Order'}
              </button>

              <div style="font-size:11px;color:#334155;text-align:center;line-height:1.6;">
                By submitting you agree to be contacted at the number provided. No payment is collected at this time.
              </div>
            </div>
          </div>
        </div>`;

      // Attach events
      document.getElementById('f-phone')?.addEventListener('input', e => { phone = e.target.value; });
      document.getElementById('f-member')?.addEventListener('input', e => { memberNumber = e.target.value; });
      document.getElementById('f-cases')?.addEventListener('input', e => { cases = e.target.value; render(); });
      document.getElementById('f-notes')?.addEventListener('input', e => { notes = e.target.value; });
      document.getElementById('btn-member-yes')?.addEventListener('click', () => { isMember = true; render(); });
      document.getElementById('btn-member-no')?.addEventListener('click', () => { isMember = false; memberNumber = ''; render(); });
      document.getElementById('btn-submit')?.addEventListener('click', handleSubmit);
    }

    async function handleSubmit() {
      phone = document.getElementById('f-phone')?.value?.trim() || '';
      memberNumber = document.getElementById('f-member')?.value?.trim() || '';
      cases = document.getElementById('f-cases')?.value || '';
      notes = document.getElementById('f-notes')?.value?.trim() || '';

      if (!phone) { error = 'Please enter your phone number.'; render(); return; }
      if (isMember === null) { error = 'Please indicate if you are a member.'; render(); return; }
      if (isMember && !memberNumber) { error = 'Please enter your member number.'; render(); return; }
      if (!parseInt(cases) || parseInt(cases) < 1) { error = 'Please enter how many cases you\'d like.'; render(); return; }

      error = ''; submitting = true; render();

      try {
        const res = await fetch(API + '/special_orders', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            upc: soUpc, name: name,
            unitsPerCase: String(unitsPerCase),
            customerPhone: phone,
            memberStatus: isMember ? 'yes' : 'no',
            customerName: memberNumber || '',
            casesRequested: parseInt(cases),
            notes: notes,
            ts: new Date().toISOString(),
          }),
        });
        if (!res.ok) throw new Error('Server error');
        submitted = true;
      } catch(e) {
        error = 'Failed to submit. Please try again or ask a staff member.';
        submitting = false;
      }
      render();
    }

    render();
    return;
  }

  // ── No QR param — show store landing page ─────────────────────────────────
  document.getElementById('root').innerHTML = `
    <style>
      body::before { content:''; position:fixed; inset:0; background-image: linear-gradient(rgba(59,130,246,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(59,130,246,0.03) 1px, transparent 1px); background-size:48px 48px; pointer-events:none; z-index:0; }
      nav { position:sticky; top:0; z-index:100; background:rgba(8,12,20,0.9); backdrop-filter:blur(12px); border-bottom:1px solid #1a2540; padding:0 32px; height:56px; display:flex; align-items:center; justify-content:space-between; }
      .hero { position:relative; z-index:1; text-align:center; padding:80px 24px 60px; max-width:700px; margin:0 auto; }
      .badge { display:inline-flex; align-items:center; gap:6px; background:#1e3a5f; border:1px solid rgba(59,130,246,0.3); color:#60a5fa; font-family:'DM Mono',monospace; font-size:11px; padding:5px 12px; border-radius:20px; margin-bottom:24px; letter-spacing:0.05em; }
      .badge::before { content:''; width:6px; height:6px; background:#22c55e; border-radius:50%; animation:pulse 2s infinite; }
      @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
      h1 { font-size:clamp(32px,5vw,56px); font-weight:700; line-height:1.1; letter-spacing:-1.5px; color:#fff; margin-bottom:16px; }
      h1 span { background:linear-gradient(135deg,#3b82f6,#60a5fa); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
      .sub { font-size:17px; color:#94a3b8; line-height:1.7; max-width:500px; margin:0 auto 36px; }
      .btn { display:inline-flex; align-items:center; gap:8px; background:#2563eb; color:#fff; padding:13px 26px; border-radius:8px; font-size:15px; font-weight:600; text-decoration:none; transition:all 0.15s; box-shadow:0 0 30px rgba(59,130,246,0.2); }
      .btn:hover { background:#1d4ed8; transform:translateY(-2px); }
      .features { position:relative; z-index:1; max-width:1000px; margin:0 auto; padding:0 24px 80px; display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
      @media(max-width:700px){ .features{grid-template-columns:1fr;} }
      .feat { background:#0d1420; border:1px solid #1a2540; border-radius:12px; padding:22px; transition:all 0.2s; }
      .feat:hover { border-color:rgba(59,130,246,0.3); transform:translateY(-2px); }
      .feat-icon { font-size:22px; margin-bottom:12px; }
      .feat-title { font-size:14px; font-weight:600; color:#fff; margin-bottom:6px; }
      .feat-desc { font-size:13px; color:#94a3b8; line-height:1.6; }
      footer { position:relative; z-index:1; border-top:1px solid #1a2540; padding:24px 32px; display:flex; justify-content:space-between; font-size:12px; color:#475569; font-family:'DM Mono',monospace; }
    </style>
    <nav>
      <div style="display:flex;align-items:center;gap:10px;font-family:'DM Mono',monospace;font-weight:700;font-size:15px;color:#fff;">
        <div style="width:28px;height:28px;background:linear-gradient(135deg,#3b82f6,#1d4ed8);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:14px;">🌿</div>
        Ukiah Co-op
      </div>
      <a href="https://www.ukiahcoop.com" style="color:#94a3b8;font-size:13px;text-decoration:none;">ukiahcoop.com →</a>
    </nav>
    <div class="hero">
      <div class="badge">SPECIAL ORDERS</div>
      <h1>Order any product<br><span>we carry</span></h1>
      <p class="sub">Scan a QR code on any shelf label to request a special order. A staff member will follow up with you directly.</p>
      <a href="https://www.ukiahcoop.com" class="btn">Visit Our Website →</a>
    </div>
    <div class="features">
      <div class="feat"><div class="feat-icon">📱</div><div class="feat-title">Scan & Order</div><div class="feat-desc">Find a product QR code on any shelf label and scan it with your phone to start a special order.</div></div>
      <div class="feat"><div class="feat-icon">📞</div><div class="feat-title">We'll Follow Up</div><div class="feat-desc">A staff member will call or text you to confirm availability, pricing, and pickup details.</div></div>
      <div class="feat"><div class="feat-icon">🏪</div><div class="feat-title">Members Save More</div><div class="feat-desc">Co-op members get access to order history and can reorder previous items with one tap.</div></div>
    </div>
    <footer>
      <span>Ukiah Natural Foods Co-op · 721 S State St, Ukiah CA</span>
      <span>707-462-4778</span>
    </footer>`;
})();
</script>
</body>
</html>
